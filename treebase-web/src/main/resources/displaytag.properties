# DisplayTag Bootstrap 5 Configuration
# https://displaytag.sourceforge.net/11/configuration.html

# CSS classes for the table (can be overridden in JSP)
css.table=table table-striped table-hover
css.th.sortable=sortable
css.th.sorted=sorted
css.th.ascending=sorted-asc
css.th.descending=sorted-desc

# Pagination placement
paging.banner.placement=bottom
paging.banner.group_size=10

# Bootstrap pagination - full (prev, pages, next)
paging.banner.full=<nav aria-label="Page navigation"><ul class="pagination justify-content-center">\
<li class="page-item"><a class="page-link" href="{1}">&laquo; First</a></li>\
<li class="page-item"><a class="page-link" href="{2}">&lsaquo; Prev</a></li>\
{0}\
<li class="page-item"><a class="page-link" href="{3}">Next &rsaquo;</a></li>\
<li class="page-item"><a class="page-link" href="{4}">Last &raquo;</a></li>\
</ul></nav>

# First page (no prev/first links)
paging.banner.first=<nav aria-label="Page navigation"><ul class="pagination justify-content-center">\
<li class="page-item disabled"><span class="page-link">&laquo; First</span></li>\
<li class="page-item disabled"><span class="page-link">&lsaquo; Prev</span></li>\
{0}\
<li class="page-item"><a class="page-link" href="{3}">Next &rsaquo;</a></li>\
<li class="page-item"><a class="page-link" href="{4}">Last &raquo;</a></li>\
</ul></nav>

# Last page (no next/last links)
paging.banner.last=<nav aria-label="Page navigation"><ul class="pagination justify-content-center">\
<li class="page-item"><a class="page-link" href="{1}">&laquo; First</a></li>\
<li class="page-item"><a class="page-link" href="{2}">&lsaquo; Prev</a></li>\
{0}\
<li class="page-item disabled"><span class="page-link">Next &rsaquo;</span></li>\
<li class="page-item disabled"><span class="page-link">Last &raquo;</span></li>\
</ul></nav>

# Single page (no pagination needed)
paging.banner.onepage=

# Page links
paging.banner.page.link=<li class="page-item"><a class="page-link" href="{1}" title="Go to page {0}">{0}</a></li>
paging.banner.page.selected=<li class="page-item active" aria-current="page"><span class="page-link">{0}</span></li>
paging.banner.page.separator=

# Page size info
paging.banner.items_name=items
paging.banner.item_name=item
paging.banner.some_items_found=<div class="text-muted small mb-2">{0} {1} found, displaying {2} to {3}.</div>
paging.banner.all_items_found=<div class="text-muted small mb-2">{0} {1} found, displaying all {2}.</div>
paging.banner.one_item_found=<div class="text-muted small mb-2">1 {0} found.</div>
paging.banner.no_items_found=<div class="text-muted small mb-2">No {0} found.</div>

# Sorting - use Font Awesome icons
sort.amount=page
sort.behavior=page

# Empty table message
basic.empty.showtable=true
basic.msg.empty_list=<div class="alert alert-info">No records found.</div>

# Export options (disabled by default, enable per-table as needed)
export.types=
export.decorated=true

# Error messages
error.msg.generic=<div class="alert alert-danger">Error generating table: {0}</div>
error.msg.invalid_page=<div class="alert alert-warning">Invalid page requested.</div>
